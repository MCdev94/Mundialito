<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundialito — maschile, femminile, misto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --field:#E7EDEC; --paper:#FFFFFF; --court:#0C4A5A; --court-soft:#13697F;
  --ink:#0A1E24; --ink-soft:#52686E; --line:#CDD8D7; --ball:#D7E24A; --warn:#B4452F;
  --radius:14px; --bar:70px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --field:#07171C; --paper:#0F2A33; --court:#9FD8E6; --court-soft:#6FB9CC;
    --ink:#EAF4F5; --ink-soft:#9BB2B8; --line:#1E4653;
  }
}
:root[data-theme="dark"]{
  --field:#07171C; --paper:#0F2A33; --court:#9FD8E6; --court-soft:#6FB9CC;
  --ink:#EAF4F5; --ink-soft:#9BB2B8; --line:#1E4653;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--field);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--court-soft);outline-offset:2px;border-radius:4px;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(var(--bar) + 40px);}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px 18px;
  padding:12px 16px;background:var(--field);border-bottom:1px solid var(--line);}
.top__row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.top__title{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;}
.top__meta{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;}
.back{border:0;background:transparent;color:var(--court);padding:0 0 6px;font-size:14.5px;font-weight:600;}
.champsel{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:6px 12px 6px 8px;font-size:13.5px;font-weight:600;margin-bottom:9px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--court);flex:none;}
.dot--f{background:#C2538B;} .dot--x{background:var(--ball);}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--court);color:var(--field);white-space:nowrap;}
.badge--soft{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:600;}
.badge--x2{background:var(--ball);color:#0A1E24;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;}
.card--tap{display:block;width:100%;text-align:left;}
.card__row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card__t{font-size:17px;font-weight:600;}
.card__s{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}

.block{margin:24px 0 0;}
.block > h2{margin:0 0 4px;font-size:15px;font-weight:700;}
.hint{margin:0 0 12px;font-size:13.5px;color:var(--ink-soft);}
.note{font-size:13.5px;color:var(--ink-soft);margin:12px 0 0;}
.empty{padding:26px 16px;text-align:center;color:var(--ink-soft);
  border:1px dashed var(--line);border-radius:var(--radius);}

.btn{display:block;width:100%;padding:15px 18px;border-radius:12px;border:1px solid var(--court);
  background:var(--court);color:var(--field);font-size:16.5px;font-weight:600;text-align:center;}
.btn[disabled]{opacity:.4;}
.btn--ghost{background:transparent;color:var(--court);}
.btn--quiet{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.btn--danger{background:transparent;color:var(--warn);border-color:var(--warn);}
.btn+.btn{margin-top:10px;}
.btn--sm{padding:10px 14px;font-size:14.5px;width:auto;display:inline-block;}
.row2{display:flex;gap:8px;}
.row2 > *{flex:1;}

.fld{display:block;margin-bottom:12px;}
.fld span{display:block;font-size:13.5px;color:var(--ink-soft);margin-bottom:5px;}
.fld input,.fld select{width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font-size:15px;}
.chip[aria-pressed="true"]{border-color:var(--court);background:var(--court);color:var(--field);}
.stepper{display:flex;align-items:center;gap:12px;}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);font-size:22px;line-height:1;}
.stepper b{font-size:22px;font-weight:700;font-stretch:112%;min-width:28px;text-align:center;}
.stepper small{color:var(--ink-soft);font-size:13.5px;}

.plist{list-style:none;margin:10px 0 0;padding:0;}
.plist li{display:flex;align-items:center;gap:10px;padding:0;border-bottom:1px solid var(--line);}
.plist li:last-child{border-bottom:0;}
.ptap{flex:1;display:flex;align-items:center;gap:10px;padding:12px 2px;border:0;
  background:transparent;text-align:left;}
.ptap .nm{flex:1;font-size:16px;}
.ptap .pt{font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.sx{font-size:11px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);
  border-radius:5px;padding:0 4px;}
.tick{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:13px;color:transparent;}
.on .tick{background:var(--court);border-color:var(--court);color:var(--field);}
.on .nm{font-weight:600;}
.sel .ptap{background:color-mix(in srgb,var(--ball) 30%,transparent);border-radius:10px;}

.pair{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.pair .seed{font-size:13px;font-weight:700;font-stretch:112%;color:var(--court);min-width:34px;
  font-variant-numeric:tabular-nums;}
.pair .nm{flex:1;font-size:15.5px;line-height:1.3;}
.pair button{border:0;background:transparent;color:var(--ink-soft);font-size:13.5px;padding:4px;}
.pair--tap{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;}
.pair--fatta{border-color:var(--court);}
.pair .pp{font-size:15px;font-weight:700;font-stretch:112%;color:var(--court);white-space:nowrap;font-variant-numeric:tabular-nums;}
.pair .pp--next{font-weight:600;color:var(--ink-soft);font-size:13.5px;}
.pair .mv{width:38px;height:40px;border:1px solid var(--line);border-radius:10px;font-size:17px;line-height:1;}
.pair .mv[disabled]{opacity:.3;}
.ptin{width:66px;height:44px;text-align:center;border:1px solid var(--line);background:var(--field);
  border-radius:10px;font-size:21px;font-weight:700;font-stretch:112%;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;}
.ptin::-webkit-outer-spin-button,.ptin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.match{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;}
.match__head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  border-bottom:1px solid var(--line);}
.match__n{font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--court);font-stretch:112%;}
.match__p{font-size:12.5px;color:var(--ink-soft);}
.side{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:0;
  background:transparent;text-align:left;}
.side .nm{flex:1;font-size:16px;line-height:1.3;}
.side .seed{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.side--win{background:color-mix(in srgb,var(--ball) 26%,transparent);}
.side--win .nm{font-weight:700;}
.net{height:9px;margin:0 14px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 5px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

.table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;}
.table th{text-align:right;font-size:12px;font-weight:600;color:var(--ink-soft);padding:10px 8px;
  border-bottom:1px solid var(--line);}
.table th:first-child,.table td:first-child{text-align:left;padding-left:14px;}
.table th:last-child,.table td:last-child{padding-right:14px;}
.table td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;}
.table tr:last-child td{border-bottom:0;}
.table .nmc{display:flex;align-items:baseline;gap:9px;}
.table .pos{font-size:13px;font-weight:700;font-stretch:112%;color:var(--ink-soft);min-width:20px;}
.table .pts{font-size:18px;font-weight:700;font-stretch:112%;}
.table .bn{color:var(--court);font-size:12px;font-weight:700;}
.lead td{background:var(--paper);box-shadow:inset 3px 0 0 var(--ball);}
.lead td:not(:first-child){box-shadow:none;}
@supports (background:color-mix(in srgb,red 10%,blue)){
  .lead td{background:color-mix(in srgb,var(--ball) 20%,var(--paper));}
}
.rowtap{cursor:pointer;}
.stelle{font-size:1.18em;white-space:nowrap;vertical-align:-1px;}
.stella{display:inline-block;width:1.02em;text-align:center;line-height:1;}
.stella--maschile{color:#2F6FDB;}
.stella--femminile{color:#E0569B;}
.stella--misto{color:#8A5FC4;}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .stella--misto{background:linear-gradient(90deg,#2F6FDB 50%,#E0569B 50%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
}
.legenda{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 0;font-size:12.5px;color:var(--ink-soft);}
.btn--oro{background:linear-gradient(180deg,#F3D27A,#D4A017);border-color:#C29312;color:#3B2A00;
  box-shadow:0 2px 10px rgba(212,160,23,.35);}
.albo{margin-top:26px;padding:16px;border-radius:var(--radius);border:1px solid #E2C46A;
  background:linear-gradient(180deg,color-mix(in srgb,#F3D27A 18%,var(--paper)),var(--paper));}
.albo__t{margin:0 0 10px;font-size:14px;font-weight:800;letter-spacing:.14em;color:#A97F0B;font-stretch:112%;}
.albo__voce{display:flex;align-items:center;gap:12px;width:100%;padding:11px 4px;border:0;
  border-top:1px solid color-mix(in srgb,#D4A017 30%,transparent);background:transparent;text-align:left;color:inherit;}
.albo__voce:first-of-type{border-top:0;}
.albo__ed{font-size:20px;font-weight:800;font-stretch:112%;color:#A97F0B;min-width:44px;}
.albo__nomi{flex:1;font-size:15.5px;font-weight:600;line-height:1.3;}
.albo__data{font-size:12.5px;color:var(--ink-soft);}
.albo__vuoto{margin:0;font-size:13.5px;color:var(--ink-soft);}
.trofeo{font-size:64px;text-align:center;line-height:1;margin:6px 0 4px;}
.festa{text-align:center;padding:8px 0 4px;}
.festa__sopra{margin:6px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}
.festa__torneo{margin:2px 0 14px;font-size:15px;font-weight:700;color:#A97F0B;}
.festa__nome{margin:0;font-size:28px;font-weight:800;font-stretch:112%;letter-spacing:-.01em;}
.festa__e{margin:2px 0;font-size:14px;color:var(--ink-soft);}
.festa__data{margin:14px 0 0;font-size:13.5px;color:var(--ink-soft);}
:root{--verde:#12805C;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--verde:#3DDC97;} }
:root[data-theme="dark"]{--verde:#3DDC97;}
.conbonus{color:var(--verde);font-weight:700;}
.bonus{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
.bonus__t{margin:0 0 10px;font-size:14px;font-weight:800;letter-spacing:.12em;color:var(--court);font-stretch:112%;}
.bonus__row{display:flex;gap:10px;}
.bonus__f{flex:1;display:block;}
.bonus__f span{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
.bonus__f input{width:100%;height:52px;text-align:center;border:1px solid var(--line);border-radius:12px;
  background:var(--field);font-size:24px;font-weight:700;font-stretch:112%;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;}
.bonus__f input::-webkit-outer-spin-button,.bonus__f input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.bonus__f input:disabled{opacity:.7;}
.bonus__n{margin:10px 0 0;font-size:13.5px;color:var(--ink-soft);}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--bar) + 22px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--field);padding:11px 18px;border-radius:999px;
  font-size:14.5px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:90%;text-align:center;}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;}
.sheet__in{background:var(--field);width:100%;max-height:84vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));}
.sheet h3{margin:0 0 4px;font-size:19px;}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.tabs button{flex:1;border:0;background:transparent;padding:12px 2px 14px;font-size:12px;
  font-weight:600;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:5px;}
.tabs button[aria-current="true"]{color:var(--court);}
.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.hide{display:none !important;}
</style>
</head>

/* ---------- punteggi ---------- */
function ordineDaTabellone(ev){
  const out = [];
  (ev.matches || []).forEach(m => {
    if(m.pb === null || m.pb === undefined){ out.push(m.pa); return; }
    const a = m.winner === "a";
    out.push(a ? m.pa : m.pb); out.push(a ? m.pb : m.pa);
  });
  return out;
}
function placements(ev){
  if(ev.ordine && ev.ordine.length) return ev.ordine.filter(i => ev.pairs[i]);
  return ordineDaTabellone(ev);
}
/* base: 4 punti per campo in gioco -> 3 campi 12, 4 campi 16, 5 campi 20 */
function baseGiornata(ev){
  const campi = (ev.matches && ev.matches.length) || Math.ceil(ev.pairs.length / 2);
  return 4 * Math.max(1, campi);
}
function numCampi(ev){ return (ev.matches && ev.matches.length) || Math.ceil(ev.pairs.length / 2); }
function puntiDefault(ev, k){ return Math.max(2, baseGiornata(ev) - 2 * k); }

/* chiude la giornata: scrive i punti nella classifica e la toglie dall'elenco */
function chiudiGiornata(ev){
  const c = C(), delta = {};
  ev.ordine.forEach((pi, k) => {
    const pts = puntiDefault(ev, k);
    ev.pairs[pi].forEach(id => delta[id] = pts);
  });
  Object.keys(delta).forEach(id => {
    const v = c.carry[id] || {pts:0, pres:0};
    c.carry[id] = {pts:(v.pts || 0) + delta[id], pres:(v.pres || 0) + 1};
  });
  c.base = (c.base || 0) + 1;
  c.ultima = {nome:ev.name, data:ev.date, quando:Date.now(), delta, ev:JSON.parse(JSON.stringify(ev))};
  c.events = c.events.filter(e => e.id !== ev.id);
  return Object.keys(delta).length;
}
function annullaUltima(){
  const c = C(), u = c.ultima; if(!u) return false;
  Object.keys(u.delta).forEach(id => {
    const v = c.carry[id]; if(!v) return;
    v.pts = Math.max(0, (v.pts || 0) - u.delta[id]);
    v.pres = Math.max(0, (v.pres || 0) - 1);
  });
  c.base = Math.max(0, (c.base || 0) - 1);
  if(u.ev){ const e = u.ev; e.status = "bozza"; c.events.push(e); }
  c.ultima = null;
  return u.ev ? u.ev.id : null;
}
/* i punti stanno sulla posizione, non sulla coppia: il 1° posto vale sempre uguale */
function initPunti(ev){
  if(!ev.ordine || !ev.ordine.length) ev.ordine = ordineDaTabellone(ev);
  if(!Array.isArray(ev.punti) || ev.punti.length !== ev.ordine.length){
    const vecchi = Array.isArray(ev.punti) ? ev.punti : [];
    ev.punti = ev.ordine.map((pi, k) => vecchi[k] !== undefined && vecchi[k] !== null ? vecchi[k] : puntiDefault(ev, k));
  }
}
function eventPoints(ev){
  const out = {};
  if(ev.status !== "chiuso" || ev.finale) return out;
  placements(ev).forEach((pi, k) => {
    const v = (Array.isArray(ev.punti) && ev.punti[k] !== undefined && ev.punti[k] !== null)
      ? Number(ev.punti[k]) : puntiDefault(ev, k);
    ev.pairs[pi].forEach(id => out[id] = v || 0);
  });
  return out;
}
const matchDone = m => (m.pb === null || m.pb === undefined) || m.winner === "a" || m.winner === "b";
const evReady = ev => ev.matches.length > 0 && ev.matches.every(matchDone);
const TORNEI = [["maschile","Mundialito Maschile",8], ["femminile","Mundialito Femminile",4], ["misto","Mundialito Misto",5]];
function pesoTorneo(c){ return Object.keys(c.carry || {}).length + (c.events || []).length * 10 + (c.base || 0); }
function firmaCarry(c){
  return Object.keys(c.carry || {}).map(id => {
    const v = c.carry[id] || {};
    return ((D.players.find(p => p.id === id) || {}).name || id).toLowerCase() + ":" + (v.pts||0) + "/" + (v.pres||0);
  }).sort().join("|");
}
/* lascia esattamente un torneo per tipo; ritorna true se ha dovuto sistemare qualcosa */
function normalizzaTornei(){
  let cambiato = false;
  const nuovi = TORNEI.map(([tipo, nome, soglia]) => {
    const gruppo = D.champs.filter(c => c.type === tipo).sort((a,b) => pesoTorneo(b) - pesoTorneo(a));
    let main = gruppo[0];
    if(!main){
      main = {id:uid(), name:nome, ed:"", type:tipo, soglia, bonus:5, settimane:8, base:0,
              carry:{}, bonusAss:null, ultima:null, events:[]};
      cambiato = true;
    }
    gruppo.slice(1).forEach(x => {
      cambiato = true;
      const vuoto = !Object.keys(x.carry || {}).length && !(x.events || []).length;
      if(vuoto) return;
      (x.events || []).forEach(e => main.events.push(e));
      if(firmaCarry(x) === firmaCarry(main)){
        main.base = Math.max(main.base || 0, x.base || 0);      // copia identica: non sommo
      } else {
        Object.keys(x.carry || {}).forEach(id => {
          const a = main.carry[id] || {pts:0, pres:0}, b = x.carry[id] || {};
          main.carry[id] = {pts:(a.pts||0) + (b.pts||0), pres:(a.pres||0) + (b.pres||0)};
        });
        main.base = (main.base || 0) + (x.base || 0);
      }
      if(!main.ultima && x.ultima) main.ultima = x.ultima;
      if(!main.bonusAss && x.bonusAss) main.bonusAss = x.bonusAss;
    });
    if(main.name !== nome){ main.name = nome; cambiato = true; }
    return main;
  });
  if(D.champs.length !== nuovi.length || D.champs.some((c,i) => c !== nuovi[i])) cambiato = true;
  D.champs = nuovi;
  if(!D.champs.some(c => c.id === D.cur)){ D.cur = D.champs[0].id; cambiato = true; }
  (D.albo || []).forEach(a => {
    const m = D.champs.find(c => c.type === a.tipo);
    if(m && a.champ_id !== m.id){ a.champ_id = m.id; cambiato = true; }
  });

  /* giocatori doppi con lo stesso nome: li unisco */
  const gruppi = {};
  D.players.forEach(p => {
    const k = p.name.trim().toLowerCase().replace(/\s+/g," ") + "|" + p.sex;
    (gruppi[k] = gruppi[k] || []).push(p);
  });
  Object.values(gruppi).filter(g => g.length > 1).forEach(g => {
    const usi = p => D.champs.reduce((n,c) => n + (c.carry[p.id] ? 1 : 0), 0);
    g.sort((a,b) => usi(b) - usi(a));
    g.slice(1).forEach(dup => { mergePlayers(dup.id, g[0].id); cambiato = true; });
  });
  return cambiato;
}

/* una stella per vittoria: blu maschile, rosa femminile, metà e metà misto */

function finaleDi(ch){ return (ch || C()).events.find(e => e.finale) || null; }

function ordered(ch){ return [...(ch||C()).events].sort((a,b) => (a.date||"").localeCompare(b.date||"") || a.created - b.created); }

/* Punteggio vero di ogni giocatore nel torneo: punti fatti in campo + bonus presenze, se raggiunto.
   pts    -> il punteggio che conta ovunque (classifica, tabellone, abbinamenti, locandina)
   campo  -> i soli punti fatti giocando, senza bonus
   bonus  -> i punti bonus presi (0 se non ancora raggiunto) */
function totals(upTo, ch){
  ch = ch || C();
  const t = {};
  D.players.forEach(p => { const c = ch.carry[p.id] || {}; t[p.id] = {campo:c.pts||0, pres:c.pres||0}; });
  for(const ev of ordered(ch)){
    if(upTo && ev.id === upTo) break;
    if(ev.status !== "chiuso") continue;
    const pp = eventPoints(ev);
    Object.keys(pp).forEach(id => { if(t[id]){ t[id].campo += pp[id]; t[id].pres += 1; } });
  }
  Object.values(t).forEach(v => {
    v.bonus = haBonus(v.pres, ch) ? ch.bonus : 0;
    v.pts = v.campo + v.bonus;
  });
  return t;
}
function haBonus(pres, ch){ return (ch.soglia || 0) > 0 && (ch.bonus || 0) > 0 && pres >= ch.soglia; }
function classifica(ch){
  ch = ch || C();
  const t = totals(null, ch);
  return D.players.map(p => {
    const v = t[p.id];
    return {id:p.id, name:p.name, sex:p.sex, pts:v.campo, pres:v.pres, bonus:v.bonus, tot:v.pts};
  }).sort((a,b) => b.tot - a.tot || b.pres - a.pres || a.name.localeCompare(b.name));
}

/* ---------- tabellone ---------- */
function buildBoard(ev){
  const t = totals(ev.id);
  ev.seeds = {};
  ev.pairs.forEach((pr,i) => ev.seeds[i] = (t[pr[0]]?t[pr[0]].pts:0) + (t[pr[1]]?t[pr[1]].pts:0));
  const order = ev.pairs.map((_,i) => i).sort((a,b) => ev.seeds[b] - ev.seeds[a]);
  ev.matches = [];
  for(let k=0; k<order.length; k+=2)
    ev.matches.push({pa:order[k], pb:(k+1 < order.length ? order[k+1] : null), winner:null});
}
function prossimoTurno(ev){
  if(ev.finale){
    const vin = [], per = [];
    ev.matches.forEach(m => {
      if(m.pb === null || m.pb === undefined){ vin.push(m.pa); return; }
      const a = m.winner === "a";
      vin.push(a ? m.pa : m.pb); per.push(a ? m.pb : m.pa);
    });
    const out = [];
    if(vin.length >= 2) out.push({pa:vin[0], pb:vin[1], winner:null});
    if(per.length >= 2) out.push({pa:per[0], pb:per[1], winner:null});
    return out;
  }
  const campi = ev.matches.length;
  const pos = Array.from({length:campi}, () => []);
  ev.matches.forEach((m,i) => {
    if(m.pb === null || m.pb === undefined){ pos[i].push(m.pa); return; }
    const w = m.winner === "a" ? m.pa : m.pb;
    const l = m.winner === "a" ? m.pb : m.pa;
    pos[Math.max(0, i-1)].push(w);
    pos[Math.min(campi-1, i+1)].push(l);
  });
  return pos.filter(a => a.length)
            .map(a => ({pa:a[0], pb:a.length > 1 ? a[1] : null, winner:null}));
}
function campoLabel(ev, i){
  if(ev.finale){
    const t = (ev.storico || []).length + 1;
    if(t === 1) return "SEMIFINALE " + (i + 1);
    return i === 0 ? "FINALE" : "3° E 4° POSTO";
  }
  const c = ev.campi || D.settings.campi || 5;
  const turno = Math.floor(i / c) + 1;
  return "CAMPO " + (i % c + 1) + (turno > 1 ? " · " + turno + "° TURNO" : "");
}
function autoPairs(ev, modo){
  const t = totals(ev.id);
  const pres = [...(ev.presenti || [])];
  const pt = id => t[id] ? t[id].pts : 0;
  const mix = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  ev.pairs = [];
  if(C().type === "misto"){
    let U = pres.filter(id => P(id).sex === "M"), F = pres.filter(id => P(id).sex === "F");
    if(modo === "cas"){ mix(U); mix(F); } else { U.sort((a,b)=>pt(b)-pt(a)); F.sort((a,b)=>pt(b)-pt(a)); }
    if(modo === "bil") F.reverse();
    const n = Math.min(U.length, F.length);
    for(let i=0;i<n;i++) ev.pairs.push([F[i], U[i]]);
  } else {
    let ids = pres.slice();
    if(modo === "cas") mix(ids); else ids.sort((a,b)=>pt(b)-pt(a));
    if(modo === "bil"){ while(ids.length >= 2) ev.pairs.push([ids.shift(), ids.pop()]); }
    else for(let i=0; i+1<ids.length; i+=2) ev.pairs.push([ids[i], ids[i+1]]);
  }
}

function matchCard(ev,m,i,cliccabile){
  const A = ev.pairs[m.pa], B = (m.pb===null||m.pb===undefined) ? null : ev.pairs[m.pb];
  const sA = ev.seeds ? ev.seeds[m.pa] : 0, sB = B && ev.seeds ? ev.seeds[m.pb] : 0;
  const pos = 2*i+1;
  return `<article class="match">
    <div class="match__head"><span class="match__n">${campoLabel(ev,i)}</span>
      <span class="match__p">${ev.finale ? "" : (B ? "coppie " + pos + " e " + (pos+1) : "riposo")}</span></div>

      <span class="nm">${esc(nm(A[0]))} · ${esc(nm(A[1]))}</span><span class="seed">${sA}</span></${cliccabile?"button":"div"}>
    ${B?`<div class="net"></div>
    <${cliccabile?"button":"div"} class="side ${cliccabile && m.winner==="b"?"side--win":""}" ${cliccabile?`data-act="win" data-i="${i}" data-s="b"`:""}>
      <span class="nm">${esc(nm(B[0]))} · ${esc(nm(B[1]))}</span><span class="seed">${sB}</span></${cliccabile?"button":"div"}>`
    :`<div class="net"></div><div class="side"><span class="nm" style="color:var(--ink-soft)">riposo</span></div>`}
  </article>`;
}

function disegnaFoglio(){
  const w = document.querySelector("#locaWrap");
  if(!w || !sheet) return;
  const lavoro = sheet.tipo === "locandina"
    ? drawLocandina(EV(sheet.id)).then(cv => [cv])
    : drawClassifica(C());
  lavoro.then(pagine => {
    LOCA = pagine; w.innerHTML = "";
    pagine.forEach(cv => { cv.style.width = "100%"; cv.style.height = "auto"; cv.style.display = "block"; w.appendChild(cv); });
  }).catch(e => { w.textContent = "Non riesco a disegnarla: " + ((e && e.message) || ""); });
}

/* ============================ AZIONI ============================ */
tabsEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  tab = b.dataset.tab; openEvent = null; sheet = null; search = ""; render();
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-act]"); if(!f) return;
  e.preventDefault();
  if(f.dataset.act === "dologin"){
    login(document.getElementById("lg_mail").value.trim(), document.getElementById("lg_pwd").value);
    return;
  }
  if(!canWrite()){ toast("Serve l'accesso da gestore per modificare"); return; }
  const misto = C().type === "misto";
  if(f.dataset.act === "addp"){
    const i = document.getElementById("newp"), v = i.value.trim(); if(!v) return;
    const sx = misto ? document.getElementById("newsex").value : (C().type === "femminile" ? "F" : "M");
    const id = uid(); D.players.push({id, name:v, sex:sx});
    const ev = EV(openEvent); ev.presenti = ev.presenti || []; ev.presenti.push(id);
    save(); render(); toast(v + " aggiunto e segnato presente");
  }
  if(f.dataset.act === "addp2"){
    const i = document.getElementById("newp2"), v = i.value.trim(); if(!v) return;
    const sx = misto ? document.getElementById("newsex2").value : (C().type === "femminile" ? "F" : "M");
    D.players.push({id:uid(), name:v, sex:sx}); save(); render(); toast(v + " aggiunto");
  }
});

document.addEventListener("input", e => {
  if(e.target.matches('[data-act="search"]')){
    search = e.target.value; const pos = e.target.selectionStart; render();
    const n = document.getElementById("q"); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  }
  if(e.target.matches('[data-act="edizione"]')){
    D.settings.edizioni = D.settings.edizioni || {};
    D.settings.edizioni[C().id] = e.target.value.trim();
    if(canWrite()) save(); else salvaLocale();
    clearTimeout(window._tEd); window._tEd = setTimeout(disegnaFoglio, 350);
  }
  if(e.target.matches('[data-act="pt"]') && canWrite()){
    const ev2 = EV(openEvent); if(!ev2) return;
    const v = e.target.value === "" ? null : Math.max(0, Math.min(999, parseInt(e.target.value,10)));
    if(Array.isArray(ev2.punti)) ev2.punti[+e.target.dataset.k] = Number.isNaN(v) ? null : v;
    save();
  }
  if((e.target.matches('[data-act="bonuspunti"]') || e.target.matches('[data-act="bonuspres"]')) && canWrite()){
    const c2 = C();
    const v = parseInt(e.target.value, 10);

function mergePlayers(from, to){
  D.champs.forEach(ch => {
    const f = ch.carry[from];
    if(f){ const t = ch.carry[to] || {pts:0, pres:0};
      ch.carry[to] = {pts:(t.pts||0)+(f.pts||0), pres:(t.pres||0)+(f.pres||0)}; delete ch.carry[from]; }
    ch.events.forEach(ev => {
      ev.presenti = (ev.presenti||[]).map(x => x === from ? to : x).filter((x,i,arr) => arr.indexOf(x) === i);
      ev.pairs = (ev.pairs||[]).map(pr => pr.map(x => x === from ? to : x));
    });
  });
  (D.albo || []).forEach(a => { a.giocatori = (a.giocatori || []).map(x => x === from ? to : x); });
  D.players = D.players.filter(p => p.id !== from);
}




/* ---------- immagine della classifica ---------- */
const CL = {
  sfondoA:"#143B70", sfondoB:"#050E20", riga:"#17477A", verde:"#0C5B45",
  verdeChiaro:"#2BC79A", testo:"#FFFFFF", tenue:"#9FB6D4", rosso:"#5A1726", oro:"#C7B079"
};
function edizioneDi(ch){
  ch = ch || C();
  const salvata = D.settings.edizioni && D.settings.edizioni[ch.id];
  if(salvata !== undefined && salvata !== null) return String(salvata);
  const m = (ch.ed || "").match(/\d+/); return m ? m[0] : "";
}
function edNum(ch){ return edizioneDi(ch); }

function rigaClass(x, X, Y, W, H, dati, verde){
  rrect(x, X, Y, W, H, H/2.4);
  x.fillStyle = verde ? CL.verde : CL.riga; x.fill();
  if(verde){
    x.strokeStyle = CL.verdeChiaro; x.lineWidth = 2.5;
    x.beginPath(); x.moveTo(X+26, Y+H-9); x.lineTo(X+W*0.62, Y+H-9); x.stroke();
  }
  const s = H > 60 ? 28 : 21, cy = Y + H/2;
  x.textBaseline = "middle"; x.fillStyle = CL.testo;
  x.textAlign = "center"; fitFont(x, String(dati.pos), 46, "700", s+2, 14);
  x.fillText(String(dati.pos), X + 34, cy);
  const tipi = dati.id ? tipiVittorie(dati.id) : [], rS = H > 60 ? 11 : 9;
  const wS = larghezzaStelle(tipi.length, rS);
  x.textAlign = "left"; fitFont(x, dati.nome, W - 178 - (wS ? wS + 10 : 0), "700", s, 13);
  x.fillText(dati.nome, X + 64, cy);
  if(tipi.length) disegnaStelle(x, tipi, X + 64 + x.measureText(dati.nome).width + 10, cy, rS, "rgba(255,255,255,.85)");
  x.textAlign = "center"; fitFont(x, String(dati.pl), 50, "700", s-2, 13);
  x.fillText(String(dati.pl), X + W - 96, cy);
  x.textAlign = "center"; fitFont(x, String(dati.pts), 66, "700", s, 13);
  x.fillText(String(dati.pts), X + W - 36, cy);
}
function intestaCol(x, X, W, Y){
  x.fillStyle = CL.tenue; x.textBaseline = "middle";
  x.font = "600 21px Archivo, Arial";
  x.textAlign = "center"; x.fillText("#", X + 34, Y);
  x.textAlign = "left";   x.fillText("GIOCATORE", X + 64, Y);
  x.textAlign = "center"; x.fillText("PL", X + W - 96, Y);
  x.fillText("PTS", X + W - 36, Y);
}

/* stelline disegnate come forme, uguali su ogni telefono */
const COL_STELLA = {maschile:["#2F6FDB"], femminile:["#E0569B"], misto:["#2F6FDB","#E0569B"]};
function tipiVittorie(id){
  return vittorieDi(id).sort((a,b) => (ORDINE_TIPI[a.tipo] - ORDINE_TIPI[b.tipo]) || ((parseInt(a.edizione)||0) - (parseInt(b.edizione)||0)))
    .map(a => a.tipo);
}
function stellaPath(x, cx, cy, r){
  x.beginPath();
  for(let i=0; i<10; i++){
    const ang = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? r*0.46 : r;
    x.lineTo(cx + rr*Math.cos(ang), cy + rr*Math.sin(ang));
  }
  x.closePath();
}
function larghezzaStelle(n, r){ return n ? n*(2*r) + (n-1)*Math.round(r*0.35) : 0; }
function disegnaStelle(x, tipi, X, cy, r, bordo){
  const passo = 2*r + Math.round(r*0.35);
  tipi.forEach((tipo, i) => {
    const cx = X + r + i*passo, col = COL_STELLA[tipo] || ["#D4A017"];
    x.save();
    stellaPath(x, cx, cy, r); x.fillStyle = col[0]; x.fill();
    if(col[1]){
      x.save(); x.beginPath(); x.rect(cx, cy - r - 2, r + 2, 2*r + 4); x.clip();
      stellaPath(x, cx, cy, r); x.fillStyle = col[1]; x.fill(); x.restore();
    }
    if(bordo){ stellaPath(x, cx, cy, r); x.lineWidth = 1.6; x.strokeStyle = bordo; x.stroke(); }
    x.restore();
  });
  return larghezzaStelle(tipi.length, r);
}
function orarioFinali(ch){
  const o = (ch.oraFinale || "").trim();
  if(!o) return "";
  return /^\d/.test(o) ? "ore " + o : o;
}
function testoFinali(ch){
  const d = ch.dataFinale || ((finaleDi(ch) || {}).date) || "";
  if(!d) return "";
  const o = orarioFinali(ch);
  return dataLunga({date:d}) + (o ? " · " + o : "");
}

async function drawClassifica(ch){

    .map((r,i) => ({id:r.id, pos:i+1, nome:r.name.toUpperCase(), pl:r.pres, pts:r.tot}));
  if(!lista.length) throw new Error("classifica vuota");
  const dataF = testoFinali(ch);

  let logo = null;
  if(D.settings.logo){ try{ logo = await loadImg(D.settings.logo); }catch(e){} }
  try{
    await Promise.all(["800 56px Archivo","700 30px Archivo","600 21px Archivo"].map(f => document.fonts.load(f)));
    await document.fonts.ready;
  }catch(e){}

  const fin = finaleDi(ch);
  const pagine = [];
  const blocchi = [];
  if(lista.length <= 20) blocchi.push({sx:lista.slice(0,8), dx:lista.slice(8,20)});
  else {
    blocchi.push({sx:lista.slice(0,8), dx:lista.slice(8,20)});
    for(let i=20; i<lista.length; i+=26) blocchi.push({sx:lista.slice(i,i+13), dx:lista.slice(i+13,i+26)});
  }

  blocchi.forEach((bl, idx) => {
    const W = 1080, HEAD = 356, LEG = 150;
    const primaPag = idx === 0;
    const hSx = primaPag ? 72 : 50, hDx = 50;
    const conFinale = !!dataF && idx === blocchi.length - 1 && !bl.dx.length;
    const corpo = Math.max(bl.sx.length * hSx, bl.dx.length * hDx, conFinale ? 400 : 240);
    const H = HEAD + corpo + LEG;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const x = cv.getContext("2d");

    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, CL.sfondoA); g.addColorStop(.55, "#0A2550"); g.addColorStop(1, CL.sfondoB);
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const gl = x.createRadialGradient(150, 60, 10, 150, 60, 420);
    gl.addColorStop(0, "rgba(120,170,230,.30)"); gl.addColorStop(1, "rgba(120,170,230,0)");
