<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundialito — maschile, femminile, misto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --field:#E7EDEC; --paper:#FFFFFF; --court:#0C4A5A; --court-soft:#13697F;
  --ink:#0A1E24; --ink-soft:#52686E; --line:#CDD8D7; --ball:#D7E24A; --warn:#B4452F;
  --radius:14px; --bar:70px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --field:#07171C; --paper:#0F2A33; --court:#9FD8E6; --court-soft:#6FB9CC;
    --ink:#EAF4F5; --ink-soft:#9BB2B8; --line:#1E4653;
  }
}
:root[data-theme="dark"]{
  --field:#07171C; --paper:#0F2A33; --court:#9FD8E6; --court-soft:#6FB9CC;
  --ink:#EAF4F5; --ink-soft:#9BB2B8; --line:#1E4653;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--field);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--court-soft);outline-offset:2px;border-radius:4px;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(var(--bar) + 40px);}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px 18px;
  padding:12px 16px;background:var(--field);border-bottom:1px solid var(--line);}
.top__row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.top__title{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;}
.top__meta{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;}
.back{border:0;background:transparent;color:var(--court);padding:0 0 6px;font-size:14.5px;font-weight:600;}
.champsel{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:6px 12px 6px 8px;font-size:13.5px;font-weight:600;margin-bottom:9px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--court);flex:none;}
.dot--f{background:#C2538B;} .dot--x{background:var(--ball);}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--court);color:var(--field);white-space:nowrap;}
.badge--soft{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:600;}
.badge--x2{background:var(--ball);color:#0A1E24;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;}
.card--tap{display:block;width:100%;text-align:left;}
.card__row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card__t{font-size:17px;font-weight:600;}
.card__s{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}

.block{margin:24px 0 0;}
.block > h2{margin:0 0 4px;font-size:15px;font-weight:700;}
.hint{margin:0 0 12px;font-size:13.5px;color:var(--ink-soft);}
.note{font-size:13.5px;color:var(--ink-soft);margin:12px 0 0;}
.empty{padding:26px 16px;text-align:center;color:var(--ink-soft);
  border:1px dashed var(--line);border-radius:var(--radius);}

.btn{display:block;width:100%;padding:15px 18px;border-radius:12px;border:1px solid var(--court);
  background:var(--court);color:var(--field);font-size:16.5px;font-weight:600;text-align:center;}
.btn[disabled]{opacity:.4;}
.btn--ghost{background:transparent;color:var(--court);}
.btn--quiet{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.btn--danger{background:transparent;color:var(--warn);border-color:var(--warn);}
.btn+.btn{margin-top:10px;}
.btn--sm{padding:10px 14px;font-size:14.5px;width:auto;display:inline-block;}
.row2{display:flex;gap:8px;}
.row2 > *{flex:1;}

.fld{display:block;margin-bottom:12px;}
.fld span{display:block;font-size:13.5px;color:var(--ink-soft);margin-bottom:5px;}
.fld input,.fld select{width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font-size:15px;}
.chip[aria-pressed="true"]{border-color:var(--court);background:var(--court);color:var(--field);}
.stepper{display:flex;align-items:center;gap:12px;}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);font-size:22px;line-height:1;}
.stepper b{font-size:22px;font-weight:700;font-stretch:112%;min-width:28px;text-align:center;}
.stepper small{color:var(--ink-soft);font-size:13.5px;}

.plist{list-style:none;margin:10px 0 0;padding:0;}
.plist li{display:flex;align-items:center;gap:10px;padding:0;border-bottom:1px solid var(--line);}
.plist li:last-child{border-bottom:0;}
.ptap{flex:1;display:flex;align-items:center;gap:10px;padding:12px 2px;border:0;
  background:transparent;text-align:left;}
.ptap .nm{flex:1;font-size:16px;}
.ptap .pt{font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.sx{font-size:11px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);
  border-radius:5px;padding:0 4px;}
.tick{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:13px;color:transparent;}
.on .tick{background:var(--court);border-color:var(--court);color:var(--field);}
.on .nm{font-weight:600;}
.sel .ptap{background:color-mix(in srgb,var(--ball) 30%,transparent);border-radius:10px;}

.pair{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.pair .seed{font-size:13px;font-weight:700;font-stretch:112%;color:var(--court);min-width:34px;
  font-variant-numeric:tabular-nums;}
.pair .nm{flex:1;font-size:15.5px;line-height:1.3;}
.pair button{border:0;background:transparent;color:var(--ink-soft);font-size:13.5px;padding:4px;}
.pair--tap{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;}
.pair--fatta{border-color:var(--court);}
.pair .pp{font-size:15px;font-weight:700;font-stretch:112%;color:var(--court);white-space:nowrap;font-variant-numeric:tabular-nums;}
.pair .pp--next{font-weight:600;color:var(--ink-soft);font-size:13.5px;}
.pair .mv{width:38px;height:40px;border:1px solid var(--line);border-radius:10px;font-size:17px;line-height:1;}
.pair .mv[disabled]{opacity:.3;}
.ptin{width:66px;height:44px;text-align:center;border:1px solid var(--line);background:var(--field);
  border-radius:10px;font-size:21px;font-weight:700;font-stretch:112%;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;}
.ptin::-webkit-outer-spin-button,.ptin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.match{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;}
.match__head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  border-bottom:1px solid var(--line);}
.match__n{font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--court);font-stretch:112%;}
.match__p{font-size:12.5px;color:var(--ink-soft);}
.side{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:0;
  background:transparent;text-align:left;}
.side .nm{flex:1;font-size:16px;line-height:1.3;}
.side .seed{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.side--win{background:color-mix(in srgb,var(--ball) 26%,transparent);}
.side--win .nm{font-weight:700;}
.net{height:9px;margin:0 14px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 5px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

.table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;}
.table th{text-align:right;font-size:12px;font-weight:600;color:var(--ink-soft);padding:10px 8px;
  border-bottom:1px solid var(--line);}
.table th:first-child,.table td:first-child{text-align:left;padding-left:14px;}
.table th:last-child,.table td:last-child{padding-right:14px;}
.table td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;}
.table tr:last-child td{border-bottom:0;}
.table .nmc{display:flex;align-items:baseline;gap:9px;}
.table .pos{font-size:13px;font-weight:700;font-stretch:112%;color:var(--ink-soft);min-width:20px;}
.table .pts{font-size:18px;font-weight:700;font-stretch:112%;}
.table .bn{color:var(--court);font-size:12px;font-weight:700;}
.lead td{background:var(--paper);box-shadow:inset 3px 0 0 var(--ball);}
.lead td:not(:first-child){box-shadow:none;}
@supports (background:color-mix(in srgb,red 10%,blue)){
  .lead td{background:color-mix(in srgb,var(--ball) 20%,var(--paper));}
}
.rowtap{cursor:pointer;}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--bar) + 22px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--field);padding:11px 18px;border-radius:999px;
  font-size:14.5px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:90%;text-align:center;}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;}
.sheet__in{background:var(--field);width:100%;max-height:84vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px));}
.sheet h3{margin:0 0 4px;font-size:19px;}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.tabs button{flex:1;border:0;background:transparent;padding:12px 2px 14px;font-size:12px;
  font-weight:600;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:5px;}
.tabs button[aria-current="true"]{color:var(--court);}
.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.hide{display:none !important;}
</style>
</head>

/* ---------- punteggi ---------- */
function ordineDaTabellone(ev){
  const out = [];
  (ev.matches || []).forEach(m => {
    if(m.pb === null || m.pb === undefined){ out.push(m.pa); return; }
    const a = m.winner === "a";
    out.push(a ? m.pa : m.pb); out.push(a ? m.pb : m.pa);
  });
  return out;
}
function placements(ev){
  if(ev.ordine && ev.ordine.length) return ev.ordine.filter(i => ev.pairs[i]);
  return ordineDaTabellone(ev);
}
/* base: 4 punti per campo in gioco -> 3 campi 12, 4 campi 16, 5 campi 20 */
function baseGiornata(ev){
  const campi = (ev.matches && ev.matches.length) || Math.ceil(ev.pairs.length / 2);
  return 4 * Math.max(1, campi);
}
function numCampi(ev){ return (ev.matches && ev.matches.length) || Math.ceil(ev.pairs.length / 2); }
function puntiDefault(ev, k){ return Math.max(2, baseGiornata(ev) - 2 * k); }

/* chiude la giornata: scrive i punti nella classifica e la toglie dall'elenco */
function chiudiGiornata(ev){
  const c = C(), delta = {};
  ev.ordine.forEach((pi, k) => {
    const pts = puntiDefault(ev, k);
    ev.pairs[pi].forEach(id => delta[id] = pts);
  });
  Object.keys(delta).forEach(id => {
    const v = c.carry[id] || {pts:0, pres:0};
    c.carry[id] = {pts:(v.pts || 0) + delta[id], pres:(v.pres || 0) + 1};
  });
  c.base = (c.base || 0) + 1;
  c.ultima = {nome:ev.name, data:ev.date, quando:Date.now(), delta, ev:JSON.parse(JSON.stringify(ev))};
  c.events = c.events.filter(e => e.id !== ev.id);
  return Object.keys(delta).length;
}
function annullaUltima(){
  const c = C(), u = c.ultima; if(!u) return false;
  Object.keys(u.delta).forEach(id => {
    const v = c.carry[id]; if(!v) return;
    v.pts = Math.max(0, (v.pts || 0) - u.delta[id]);
    v.pres = Math.max(0, (v.pres || 0) - 1);
  });
  c.base = Math.max(0, (c.base || 0) - 1);
  if(u.ev){ const e = u.ev; e.status = "bozza"; c.events.push(e); }
  c.ultima = null;
  return u.ev ? u.ev.id : null;
}
/* i punti stanno sulla posizione, non sulla coppia: il 1° posto vale sempre uguale */
function initPunti(ev){
  if(!ev.ordine || !ev.ordine.length) ev.ordine = ordineDaTabellone(ev);
  if(!Array.isArray(ev.punti) || ev.punti.length !== ev.ordine.length){
    const vecchi = Array.isArray(ev.punti) ? ev.punti : [];
    ev.punti = ev.ordine.map((pi, k) => vecchi[k] !== undefined && vecchi[k] !== null ? vecchi[k] : puntiDefault(ev, k));
  }
}
function eventPoints(ev){
  const out = {};
  if(ev.status !== "chiuso" || ev.finale) return out;
  placements(ev).forEach((pi, k) => {
    const v = (Array.isArray(ev.punti) && ev.punti[k] !== undefined && ev.punti[k] !== null)
      ? Number(ev.punti[k]) : puntiDefault(ev, k);
    ev.pairs[pi].forEach(id => out[id] = v || 0);
  });
  return out;
}
const matchDone = m => (m.pb === null || m.pb === undefined) || m.winner === "a" || m.winner === "b";

const TORNEI = [["maschile","Mundialito Maschile",8], ["femminile","Mundialito Femminile",4], ["misto","Mundialito Misto",5]];
function pesoTorneo(c){ return Object.keys(c.carry || {}).length + (c.events || []).length * 10 + (c.base || 0); }
function firmaCarry(c){
  return Object.keys(c.carry || {}).map(id => {
    const v = c.carry[id] || {};
    return ((D.players.find(p => p.id === id) || {}).name || id).toLowerCase() + ":" + (v.pts||0) + "/" + (v.pres||0);
  }).sort().join("|");
}
/* lascia esattamente un torneo per tipo; ritorna true se ha dovuto sistemare qualcosa */
function normalizzaTornei(){
  let cambiato = false;
  const nuovi = TORNEI.map(([tipo, nome, soglia]) => {
    const gruppo = D.champs.filter(c => c.type === tipo).sort((a,b) => pesoTorneo(b) - pesoTorneo(a));
    let main = gruppo[0];
    if(!main){
      main = {id:uid(), name:nome, ed:"", type:tipo, soglia, bonus:5, settimane:8, base:0,
              carry:{}, bonusAss:null, ultima:null, events:[]};
      cambiato = true;
    }
    gruppo.slice(1).forEach(x => {
      cambiato = true;
      const vuoto = !Object.keys(x.carry || {}).length && !(x.events || []).length;
      if(vuoto) return;
      (x.events || []).forEach(e => main.events.push(e));
      if(firmaCarry(x) === firmaCarry(main)){
        main.base = Math.max(main.base || 0, x.base || 0);      // copia identica: non sommo
      } else {
        Object.keys(x.carry || {}).forEach(id => {
          const a = main.carry[id] || {pts:0, pres:0}, b = x.carry[id] || {};
          main.carry[id] = {pts:(a.pts||0) + (b.pts||0), pres:(a.pres||0) + (b.pres||0)};
        });
        main.base = (main.base || 0) + (x.base || 0);
      }
      if(!main.ultima && x.ultima) main.ultima = x.ultima;
      if(!main.bonusAss && x.bonusAss) main.bonusAss = x.bonusAss;
    });
    if(main.name !== nome){ main.name = nome; cambiato = true; }
    return main;
  });
  if(D.champs.length !== nuovi.length || D.champs.some((c,i) => c !== nuovi[i])) cambiato = true;
  D.champs = nuovi;
  if(!D.champs.some(c => c.id === D.cur)){ D.cur = D.champs[0].id; cambiato = true; }

  /* giocatori doppi con lo stesso nome: li unisco */
  const gruppi = {};
  D.players.forEach(p => {
    const k = p.name.trim().toLowerCase().replace(/\s+/g," ") + "|" + p.sex;
    (gruppi[k] = gruppi[k] || []).push(p);
  });
  Object.values(gruppi).filter(g => g.length > 1).forEach(g => {
    const usi = p => D.champs.reduce((n,c) => n + (c.carry[p.id] ? 1 : 0), 0);
    g.sort((a,b) => usi(b) - usi(a));
    g.slice(1).forEach(dup => { mergePlayers(dup.id, g[0].id); cambiato = true; });
  });
  return cambiato;
}

function ordered(ch){ return [...(ch||C()).events].sort((a,b) => (a.date||"").localeCompare(b.date||"") || a.created - b.created); }

function totals(upTo, ch){
  ch = ch || C();
  const t = {};
  D.players.forEach(p => { const c = ch.carry[p.id] || {}; t[p.id] = {pts:c.pts||0, pres:c.pres||0}; });
  for(const ev of ordered(ch)){
    if(upTo && ev.id === upTo) break;
    if(ev.status !== "chiuso") continue;
    const pp = eventPoints(ev);
    Object.keys(pp).forEach(id => { if(t[id]){ t[id].pts += pp[id]; t[id].pres += 1; } });
  }

}
function classifica(ch){

/* ---------- tabellone ---------- */
function buildBoard(ev){
  const t = totals(ev.id);
  ev.seeds = {};
  ev.pairs.forEach((pr,i) => ev.seeds[i] = (t[pr[0]]?t[pr[0]].pts:0) + (t[pr[1]]?t[pr[1]].pts:0));
  const order = ev.pairs.map((_,i) => i).sort((a,b) => ev.seeds[b] - ev.seeds[a]);
  ev.matches = [];
  for(let k=0; k<order.length; k+=2)
    ev.matches.push({pa:order[k], pb:(k+1 < order.length ? order[k+1] : null), winner:null});
}
function prossimoTurno(ev){
  if(ev.finale){
    const vin = [], per = [];
    ev.matches.forEach(m => {
      if(m.pb === null || m.pb === undefined){ vin.push(m.pa); return; }
      const a = m.winner === "a";
      vin.push(a ? m.pa : m.pb); per.push(a ? m.pb : m.pa);
    });
    const out = [];
    if(vin.length >= 2) out.push({pa:vin[0], pb:vin[1], winner:null});
    if(per.length >= 2) out.push({pa:per[0], pb:per[1], winner:null});
    return out;
  }
  const campi = ev.matches.length;
  const pos = Array.from({length:campi}, () => []);
  ev.matches.forEach((m,i) => {
    if(m.pb === null || m.pb === undefined){ pos[i].push(m.pa); return; }
    const w = m.winner === "a" ? m.pa : m.pb;
    const l = m.winner === "a" ? m.pb : m.pa;
    pos[Math.max(0, i-1)].push(w);
    pos[Math.min(campi-1, i+1)].push(l);
  });
  return pos.filter(a => a.length)
            .map(a => ({pa:a[0], pb:a.length > 1 ? a[1] : null, winner:null}));
}
function campoLabel(ev, i){
  if(ev.finale){
    const t = (ev.storico || []).length + 1;
    if(t === 1) return "SEMIFINALE " + (i + 1);
    return i === 0 ? "FINALE" : "3° E 4° POSTO";
  }
  const c = ev.campi || D.settings.campi || 5;
  const turno = Math.floor(i / c) + 1;
  return "CAMPO " + (i % c + 1) + (turno > 1 ? " · " + turno + "° TURNO" : "");
}
function autoPairs(ev, modo){
  const t = totals(ev.id);
  const pres = [...(ev.presenti || [])];
  const pt = id => t[id] ? t[id].pts : 0;
  const mix = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  ev.pairs = [];
  if(C().type === "misto"){
    let U = pres.filter(id => P(id).sex === "M"), F = pres.filter(id => P(id).sex === "F");
    if(modo === "cas"){ mix(U); mix(F); } else { U.sort((a,b)=>pt(b)-pt(a)); F.sort((a,b)=>pt(b)-pt(a)); }
    if(modo === "bil") F.reverse();
    const n = Math.min(U.length, F.length);
    for(let i=0;i<n;i++) ev.pairs.push([F[i], U[i]]);
  } else {
    let ids = pres.slice();
    if(modo === "cas") mix(ids); else ids.sort((a,b)=>pt(b)-pt(a));
    if(modo === "bil"){ while(ids.length >= 2) ev.pairs.push([ids.shift(), ids.pop()]); }
    else for(let i=0; i+1<ids.length; i+=2) ev.pairs.push([ids[i], ids[i+1]]);
  }
}

  if(ev.status === "chiuso") return renderEventoChiuso(ev);
  const misto = C().type === "misto";
  const presenti = ev.presenti || [];
  const inPair = new Set(ev.pairs.flat());
  let body = "";

  if(step === "presenti"){
    const q = search.toLowerCase();
    const list = D.players.filter(p => eligible(p) && p.name.toLowerCase().includes(q))
      .sort((a,b) => a.name.localeCompare(b.name));
    const t = totals(ev.id);
    const nF = presenti.filter(id => P(id).sex === "F").length;
    const sub = misto ? `${nF} donne · ${presenti.length-nF} uomini` :
      `${presenti.length} selezionati${presenti.length%2?" · dispari, uno resta fuori":""}`;
    body = `
    <div class="block"><h2>Chi c'è stasera</h2><p class="hint">${sub}</p>
    <label class="fld"><input id="q" placeholder="Cerca un nome" value="${esc(search)}" data-act="search" autocomplete="off"></label>
    <form class="row2" data-act="addp">
      <input id="newp" placeholder="Giocatore nuovo" autocomplete="off" enterkeyhint="done"
        style="padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);">
      ${misto?`<select id="newsex" style="flex:0 0 86px;padding:13px 8px;border:1px solid var(--line);border-radius:12px;background:var(--paper);">
        <option value="F">Donna</option><option value="M">Uomo</option></select>`:""}
      <button class="btn btn--ghost btn--sm" type="submit" style="flex:0 0 auto;">Aggiungi</button>
    </form>
    <ul class="plist">${list.map(p => `<li class="${presenti.includes(p.id)?"on":""}">
      <button class="ptap" data-act="togglep" data-id="${p.id}">
        <span class="tick">✓</span><span class="nm">${esc(p.name)}</span>
        ${misto?`<span class="sx">${p.sex}</span>`:""}
        <span class="pt">${t[p.id]?t[p.id].pts:0} pt</span></button></li>`).join("")}</ul></div>
    <div class="block"><button class="btn" data-act="step" data-v="coppie" ${presenti.length>=4?"":"disabled"}>Passa alle coppie</button></div>`;
  }

  if(step === "coppie"){
    const t = totals(ev.id);
    const liberi = presenti.filter(id => !inPair.has(id));
    body = `
    <div class="block"><h2>Coppie</h2>
    <p class="hint">${misto?"Ogni coppia è una donna e un uomo. ":""}Tocca due nomi per abbinarli, o lascia fare all'app.</p>
    <div class="row2">
      <button class="btn btn--ghost btn--sm" data-act="auto" data-m="bil">Bilanciate</button>
      <button class="btn btn--ghost btn--sm" data-act="auto" data-m="liv">Per livello</button>
    </div>
    ${ev.pairs.length?`<div class="block">${ev.pairs.map((pr,i)=>`
      <div class="pair"><span class="seed">${(t[pr[0]]?t[pr[0]].pts:0)+(t[pr[1]]?t[pr[1]].pts:0)}</span>
        <span class="nm">${esc(nm(pr[0]))}<br>${esc(nm(pr[1]))}</span>
        <button data-act="unpair" data-i="${i}">Sciogli</button></div>`).join("")}</div>`:""}
    ${liberi.length?`<div class="block"><h2>Ancora liberi</h2><ul class="plist">${liberi.map(id=>`
      <li class="${sel.includes(id)?"sel":""}"><button class="ptap" data-act="pick" data-id="${id}">
        <span class="nm">${esc(nm(id))}</span>${misto?`<span class="sx">${P(id).sex}</span>`:""}
        <span class="pt">${t[id]?t[id].pts:0} pt</span></button></li>`).join("")}</ul></div>`:""}
    </div>
    <div class="block">
      <button class="btn" data-act="board" ${ev.pairs.length>=2?"":"disabled"}>Genera il tabellone</button>
      <button class="btn btn--quiet" data-act="step" data-v="presenti">Torna ai presenti</button>
    </div>`;
  }

  if(step === "tabellone"){
    const turno = (ev.storico || []).length + 1;
    if(ev.finale){
      body = `<div class="block"><h2>${turno === 1 ? "Semifinali" : "Finale"}</h2>
      <p class="hint">${turno === 1 ? "I primi 8 della classifica, accoppiati primo con ottavo e così via. Tocca chi passa."
                                    : "Le due vincenti si giocano il titolo, le due perdenti il terzo posto."}</p>
      ${ev.matches.map((m,i) => matchCard(ev,m,i,true)).join("")}</div>
      <div class="block">
        ${turno >= 2
          ? `<button class="btn" data-act="close" ${evReady(ev)?"":"disabled"}>Proclama i campioni</button>`
          : `<button class="btn" data-act="turno" ${evReady(ev)?"":"disabled"}>Vai alla finale</button>`}
        ${!evReady(ev)?`<p class="note">Segna il vincitore di ogni campo.</p>`:""}
        <button class="btn btn--quiet" data-act="loca">Crea la locandina</button>
        ${turno > 1 ? `<button class="btn btn--quiet" data-act="indietro">Torna alle semifinali</button>` : ""}
      </div>`;
    } else {
      body = `<div class="block"><h2>Tabellone</h2>
      <p class="hint">Coppie ordinate per somma punti, a due a due sui campi. Si gioca, e a fine giornata si passa al punteggio.</p>
      ${ev.matches.map((m,i) => matchCard(ev,m,i,false)).join("")}</div>
      <div class="block">
        <button class="btn" data-act="vaipunteggio">Vai al punteggio</button>
        <button class="btn btn--ghost" data-act="loca">Crea la locandina</button>
        <button class="btn btn--quiet" data-act="step" data-v="coppie">Modifica le coppie</button>
      </div>`;
    }
  }

  if(step === "punteggio"){
    ev.ordine = (ev.ordine || []).filter(i => ev.pairs[i]);
    const messi = new Set(ev.ordine);
    const liberi = ev.pairs.map((_,i) => i).filter(i => !messi.has(i));
    const prossimo = ev.ordine.length + 1;
    body = `<div class="block"><h2>Ordine di arrivo</h2>
    <p class="hint">Tocca le coppie dalla prima classificata all'ultima. ${numCampi(ev)} camp${numCampi(ev)===1?"o":"i"}: ${baseGiornata(ev)} punti alla prima, poi 2 in meno per ogni posizione. Per togliere una coppia dall'ordine toccala di nuovo.</p>
    ${ev.ordine.length ? ev.ordine.map((pi,k) => `
      <button class="pair pair--tap pair--fatta" data-act="togli" data-k="${k}">
        <span class="seed">${k+1}°</span>
        <span class="nm">${esc(nm(ev.pairs[pi][0]))}<br>${esc(nm(ev.pairs[pi][1]))}</span>
        <span class="pp">${puntiDefault(ev,k)} pt</span>
      </button>`).join("") : `<p class="empty">Comincia toccando la coppia arrivata prima.</p>`}
    </div>
    ${liberi.length ? `<div class="block"><h2>Da piazzare</h2>
      ${liberi.map(pi => `
        <button class="pair pair--tap" data-act="piazza" data-pi="${pi}">
          <span class="seed">+</span>
          <span class="nm">${esc(nm(ev.pairs[pi][0]))}<br>${esc(nm(ev.pairs[pi][1]))}</span>
          <span class="pp pp--next">diventa ${prossimo}°</span>
        </button>`).join("")}</div>` : ""}
    <div class="block">
      <button class="btn" data-act="assegna" ${liberi.length || !ev.ordine.length ? "disabled" : ""}>Assegna i punti e chiudi la giornata</button>
      ${liberi.length ? `<p class="note">Manca${liberi.length===1?"":"no"} ${liberi.length} copp${liberi.length===1?"ia":"ie"} da piazzare.</p>` : ""}
      ${ev.ordine.length ? `<button class="btn btn--quiet" data-act="ricomincia">Ricomincia l'ordine</button>` : ""}
      <button class="btn btn--quiet" data-act="step" data-v="tabellone">Torna al tabellone</button>
    </div>`;
  }

  app.innerHTML = `
  <header class="top"><button class="back" data-act="home">← Giornate</button>
    <div class="top__row"><div><h1 class="top__title">${esc(ev.name)}</h1>
      <p class="top__meta">${dataIt(ev.date)} · ${ev.campi} camp${ev.campi===1?"o":"i"}</p></div>
      <button class="badge badge--soft" data-act="editev">Modifica</button></div>
  </header>${body}`;
}

function matchCard(ev,m,i,cliccabile){
  const A = ev.pairs[m.pa], B = (m.pb===null||m.pb===undefined) ? null : ev.pairs[m.pb];
  const sA = ev.seeds ? ev.seeds[m.pa] : 0, sB = B && ev.seeds ? ev.seeds[m.pb] : 0;
  const pos = 2*i+1;
  return `<article class="match">
    <div class="match__head"><span class="match__n">${campoLabel(ev,i)}</span>
      <span class="match__p">${ev.finale ? "" : (B ? "coppie " + pos + " e " + (pos+1) : "riposo")}</span></div>
    <${cliccabile?"button":"div"} class="side ${cliccabile && m.winner==="a"?"side--win":""}" ${cliccabile?`data-act="win" data-i="${i}" data-s="a"`:""}>
      <span class="nm">${esc(nm(A[0]))} · ${esc(nm(A[1]))}</span><span class="seed">${sA}</span></${cliccabile?"button":"div"}>
    ${B?`<div class="net"></div>
    <${cliccabile?"button":"div"} class="side ${cliccabile && m.winner==="b"?"side--win":""}" ${cliccabile?`data-act="win" data-i="${i}" data-s="b"`:""}>
      <span class="nm">${esc(nm(B[0]))} · ${esc(nm(B[1]))}</span><span class="seed">${sB}</span></${cliccabile?"button":"div"}>`
    :`<div class="net"></div><div class="side"><span class="nm" style="color:var(--ink-soft)">riposo</span></div>`}
  </article>`;
}

    const righe = [];
    D.champs.forEach(ch => {
      const t = totals(null, ch);
      const r = t[sheet.id]; if(!r || (!r.pts && !r.pres)) return;
      const bonus = r.pres > ch.soglia ? ch.bonus : 0;
      const pos = classifica(ch).filter(x => x.pres > 0).findIndex(x => x.id === sheet.id) + 1;
      righe.push(`<tr><td>${esc(ch.name)}<br><span class="pt">${pos?`${pos}° posto`:""}</span></td>
        <td class="pts">${r.pts + bonus}</td><td>${r.pres}</td></tr>`);
    });
    const sto = ordered().filter(e => e.status === "chiuso" && e.pairs.flat().includes(sheet.id)).reverse()
      .map(e => { const pp = eventPoints(e); const pr = e.pairs.find(x => x.includes(sheet.id));
        const comp = pr[0] === sheet.id ? pr[1] : pr[0];
        return `<tr><td>${esc(e.name)}<br><span class="pt">con ${esc(nm(comp))}</span></td><td class="pts">${pp[sheet.id]}</td></tr>`; });
    const altri = D.players.filter(x => x.id !== sheet.id && x.sex === p.sex && !x.archived)
      .sort((a,b) => a.name.localeCompare(b.name));
    inner = `<h3>${esc(p.name)}</h3><p class="hint">${p.sex === "F" ? "Donna" : "Uomo"}</p>
      ${righe.length?`<table class="table"><thead><tr><th>Campionato</th><th>Punti</th><th>Pres.</th></tr></thead>
        <tbody>${righe.join("")}</tbody></table>`:`<p class="empty">Nessuna presenza registrata.</p>`}
      ${sto.length?`<div class="block"><h2>Giornate in ${esc(C().name)}</h2>
        <table class="table"><tbody>${sto.join("")}</tbody></table></div>`:""}
      <div class="block"><h2>Correzioni</h2>
        <button class="btn btn--quiet" data-act="rename" data-id="${sheet.id}">Cambia nome</button>
        <button class="btn btn--quiet" data-act="sex" data-id="${sheet.id}">Segna come ${p.sex==="F"?"uomo":"donna"}</button>
        <button class="btn btn--quiet" data-act="archive" data-id="${sheet.id}">${p.archived?"Rimetti in lista":"Segna come ritirato"}</button>
        <label class="fld" style="margin-top:12px"><span>È la stessa persona di…</span>
          <select id="mergeTo"><option value="">— scegli per unire le schede —</option>
          ${altri.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>
        <button class="btn btn--quiet" data-act="merge" data-id="${sheet.id}">Unisci le due schede</button>
        <button class="btn btn--ghost" data-act="closesheet">Chiudi</button></div>`;
  }

  if(sheet.tipo === "login"){
    inner = `<h3>Accesso gestore</h3>
      <p class="hint">Serve solo a chi gestisce le giornate. Si fa una volta sola: la sessione resta su questo dispositivo.</p>
      <form data-act="dologin">
        <label class="fld"><span>Mail</span><input id="lg_mail" type="email" autocomplete="username" inputmode="email"></label>
        <label class="fld"><span>Password</span><input id="lg_pwd" type="password" autocomplete="current-password"></label>
        <button class="btn" type="submit">Entra</button>
      </form>
      <div class="block"><button class="btn btn--quiet" data-act="closesheet">Annulla</button></div>`;
  }

  if(sheet.tipo === "classifica"){
    inner = `<h3>Classifica da condividere</h3>
      <p class="hint">Una pagina ogni 20-26 giocatori. Immagini per WhatsApp o PDF da stampare.</p>
      <label class="fld" style="margin-bottom:10px"><span>Edizione da stampare</span>
        <input data-act="edizione" inputmode="numeric" value="${esc(edizioneDi(C()))}" placeholder="es. 2" style="max-width:120px"></label>
      <div id="locaWrap" style="background:var(--paper);border:1px solid var(--line);border-radius:12px;
        padding:8px;min-height:140px;display:grid;gap:8px;place-items:center;color:var(--ink-soft);font-size:14px">Preparo le immagini…</div>
      <div class="block">
        <button class="btn" data-act="loca-png">Scarica le immagini</button>
        <button class="btn btn--ghost" data-act="loca-share">Condividi</button>
        <button class="btn btn--quiet" data-act="loca-pdf">Scarica il PDF</button>
        <button class="btn btn--quiet" data-act="closesheet">Chiudi</button>
      </div>`;
  }

  if(sheet.tipo === "locandina"){
    inner = `<h3>Locandina</h3>
      <p class="hint">Immagine pronta per WhatsApp, o PDF da stampare.</p>
      <label class="fld" style="margin-bottom:10px"><span>Edizione da stampare</span>
        <input data-act="edizione" inputmode="numeric" value="${esc(edizioneDi(C()))}" placeholder="es. 2" style="max-width:120px"></label>
      <div id="locaWrap" style="background:var(--paper);border:1px solid var(--line);border-radius:12px;
        padding:8px;min-height:140px;display:grid;place-items:center;color:var(--ink-soft);font-size:14px">Preparo l'immagine…</div>
      <div class="block">
        <button class="btn" data-act="loca-png">Scarica l'immagine</button>
        <button class="btn btn--ghost" data-act="loca-share">Condividi</button>
        <button class="btn btn--quiet" data-act="loca-pdf">Scarica il PDF</button>
        <button class="btn btn--quiet" data-act="closesheet">Chiudi</button>
      </div>`;
  }

  if(sheet.tipo === "event"){
    const ev = sheet.id ? EV(sheet.id) : null;
    const v = ev || {name:"", date:oggi(), ora:""};
    inner = `<h3>${ev?"Modifica giornata":"Nuova giornata"}</h3>
      <label class="fld"><span>Nome</span><input id="ev_name" value="${esc(v.name)}" placeholder="${giornateChiuse()+1}ª giornata"></label>
      <div class="row2"><label class="fld" style="flex:2"><span>Data</span><input id="ev_date" type="date" value="${v.date}"></label>
        <label class="fld" style="flex:1"><span>Ora</span><input id="ev_ora" value="${esc(v.ora||"")}" placeholder="11:30"></label></div>
      <div class="block" style="margin-top:0"><h2>Campi</h2><div class="stepper">
        <button data-act="evcampi" data-v="-1">−</button><b id="ev_campi">${sheet.tmp.campi}</b>
        <button data-act="evcampi" data-v="1">+</button></div></div>
      <div class="block"><button class="btn" data-act="saveev">${ev?"Salva":"Crea la giornata"}</button>
        <button class="btn btn--quiet" data-act="closesheet">Annulla</button>
        ${ev?`<button class="btn btn--danger" data-act="delev">Elimina la giornata</button>`:""}</div>`;
  }

  const d = document.createElement("div");
  d.className = "sheet"; d.innerHTML = `<div class="sheet__in">${inner}</div>`;
  d.addEventListener("click", e => { if(e.target === d){ sheet = null; render(); } });
  document.body.appendChild(d);
  if(sheet.tipo === "login"){
    inner = `<h3>Accesso gestore</h3>
      <p class="hint">Serve solo a chi gestisce le giornate. Si fa una volta sola: la sessione resta su questo dispositivo.</p>
      <form data-act="dologin">
        <label class="fld"><span>Mail</span><input id="lg_mail" type="email" autocomplete="username" inputmode="email"></label>
        <label class="fld"><span>Password</span><input id="lg_pwd" type="password" autocomplete="current-password"></label>
        <button class="btn" type="submit">Entra</button>
      </form>
      <div class="block"><button class="btn btn--quiet" data-act="closesheet">Annulla</button></div>`;
  }

  if(sheet.tipo === "locandina" || sheet.tipo === "classifica") disegnaFoglio();
}
function disegnaFoglio(){
  const w = document.querySelector("#locaWrap");
  if(!w || !sheet) return;
  const lavoro = sheet.tipo === "locandina"
    ? drawLocandina(EV(sheet.id)).then(cv => [cv])
    : drawClassifica(C());
  lavoro.then(pagine => {
    LOCA = pagine; w.innerHTML = "";
    pagine.forEach(cv => { cv.style.width = "100%"; cv.style.height = "auto"; cv.style.display = "block"; w.appendChild(cv); });
  }).catch(e => { w.textContent = "Non riesco a disegnarla: " + ((e && e.message) || ""); });
}

/* ============================ AZIONI ============================ */
tabsEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  tab = b.dataset.tab; openEvent = null; sheet = null; search = ""; render();
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-act]"); if(!f) return;
  e.preventDefault();
  if(f.dataset.act === "dologin"){
    login(document.getElementById("lg_mail").value.trim(), document.getElementById("lg_pwd").value);
    return;
  }
  if(!canWrite()){ toast("Serve l'accesso da gestore per modificare"); return; }
  const misto = C().type === "misto";
  if(f.dataset.act === "addp"){
    const i = document.getElementById("newp"), v = i.value.trim(); if(!v) return;
    const sx = misto ? document.getElementById("newsex").value : (C().type === "femminile" ? "F" : "M");
    const id = uid(); D.players.push({id, name:v, sex:sx});
    const ev = EV(openEvent); ev.presenti = ev.presenti || []; ev.presenti.push(id);
    save(); render(); toast(v + " aggiunto e segnato presente");
  }
  if(f.dataset.act === "addp2"){
    const i = document.getElementById("newp2"), v = i.value.trim(); if(!v) return;
    const sx = misto ? document.getElementById("newsex2").value : (C().type === "femminile" ? "F" : "M");
    D.players.push({id:uid(), name:v, sex:sx}); save(); render(); toast(v + " aggiunto");
  }
});

document.addEventListener("input", e => {
  if(e.target.matches('[data-act="search"]')){
    search = e.target.value; const pos = e.target.selectionStart; render();
    const n = document.getElementById("q"); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  }
  if(e.target.matches('[data-act="edizione"]')){
    D.settings.edizioni = D.settings.edizioni || {};
    D.settings.edizioni[C().id] = e.target.value.trim();
    if(canWrite()) save(); else salvaLocale();
    clearTimeout(window._tEd); window._tEd = setTimeout(disegnaFoglio, 350);
  }
  if(e.target.matches('[data-act="pt"]') && canWrite()){
    const ev2 = EV(openEvent); if(!ev2) return;
    const v = e.target.value === "" ? null : Math.max(0, Math.min(999, parseInt(e.target.value,10)));
    if(Array.isArray(ev2.punti)) ev2.punti[+e.target.dataset.k] = Number.isNaN(v) ? null : v;
    save();
  }
  if(e.target.matches('[data-act="firma"]') && canWrite()){ D.settings.firma = e.target.value; save(); }
  if(e.target.matches('[data-act="logo"]')) setLogo(e.target.files[0]);
  if(e.target.matches('[data-act="import"]')) doImport(e.target.files[0]);
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, ev = EV(openEvent), c = C();
  if(!canWrite() && !AZIONI_LETTURA.has(a)){
    toast("Serve l'accesso da gestore per modificare"); return;
  }

  if(a === "home"){ openEvent = null; render(); return; }
  if(a === "closesheet"){ sheet = null; render(); return; }

  /* campionati */
  if(a === "champs"){ sheet = {tipo:"champs"}; render(); return; }
  if(a === "setchamp"){ D.cur = el.dataset.id; sheet = null; openEvent = null; tab = "giornate"; search = ""; save(); render(); return; }
  if(a === "newchamp"){ return; }
  if(a === "chtype"){ sheet.tmp.type = el.dataset.v; render(); return; }
  if(a === "chset"){
    const k = el.dataset.k;
    const lim = k === "soglia" ? [0,40] : k === "settimane" ? [6,12] : [0,50];
    sheet.tmp[k] = Math.max(lim[0], Math.min(lim[1], sheet.tmp[k] + (+el.dataset.v))); render(); return;
  }
  if(a === "savechamp"){
    const name = (document.getElementById("ch_name").value || "").trim() || "Mundialito " + tipoLabel(sheet.tmp.type).toLowerCase();
    const ed = "";
    const id = uid();
    D.champs.push({id, name, ed, type:sheet.tmp.type, soglia:sheet.tmp.soglia, bonus:sheet.tmp.bonus,
      settimane:sheet.tmp.settimane || 8, base:0, carry:{}, bonusAss:null, events:[]});
    D.cur = id; sheet = null; tab = "giornate"; save(); render(); toast("Campionato creato"); return;
  }

  /* giornate */
  if(a === "newev"){ sheet = {tipo:"event", id:null, tmp:{mult:1, campi:D.settings.campi}}; render(); return; }
  if(a === "editev"){ sheet = {tipo:"event", id:openEvent, tmp:{mult:ev.mult, campi:ev.campi}}; render(); return; }
  if(a === "openev"){ openEvent = el.dataset.id; const x = EV(openEvent);
    step = x.finale ? "tabellone"
      : (x.ordine && x.ordine.length) ? "punteggio"
      : (x.matches && x.matches.length) ? "tabellone"
      : x.pairs.length ? "coppie" : "presenti";
    sel = []; search = ""; render(); return; }
  if(a === "evcampi"){ sheet.tmp.campi = Math.max(1, Math.min(12, sheet.tmp.campi + (+el.dataset.v)));
    document.getElementById("ev_campi").textContent = sheet.tmp.campi; return; }
  if(a === "saveev"){
    const name = (document.getElementById("ev_name").value || "").trim() || "Giornata del " + dataIt(oggi());
    const date = document.getElementById("ev_date").value || oggi();
    const ora = (document.getElementById("ev_ora").value || "").trim();
    if(sheet.id) Object.assign(EV(sheet.id), {name, date, ora, mult:sheet.tmp.mult, campi:sheet.tmp.campi});
    else{
      const id = uid();
      c.events.push({id, created:Date.now(), name, date, ora, mult:sheet.tmp.mult, campi:sheet.tmp.campi,
        status:"bozza", presenti:[], pairs:[], matches:[], seeds:{}});
      openEvent = id; step = "presenti"; sel = [];
    }
    sheet = null; save(); render(); return;
  }
  if(a === "delev"){
    const id = (sheet && sheet.id) ? sheet.id : openEvent;
    if(confirm("Elimino questa giornata e i suoi punti?")){
      c.events = c.events.filter(x => x.id !== id); sheet = null; openEvent = null; save(); render();
    } return;
  }

  /* wizard */
  if(a === "step"){ step = el.dataset.v; sel = []; search = ""; render(); return; }
  if(a === "togglep"){
    const id = el.dataset.id; ev.presenti = ev.presenti || [];
    if(ev.presenti.includes(id)){
      ev.presenti = ev.presenti.filter(x => x !== id);
      ev.pairs = ev.pairs.filter(pr => !pr.includes(id));
    } else ev.presenti.push(id);
    save(); render(); return;
  }
  if(a === "pick"){
    const id = el.dataset.id;
    if(sel.includes(id)) sel = sel.filter(x => x !== id); else sel.push(id);
    if(sel.length === 2){
      if(c.type === "misto" && P(sel[0]).sex === P(sel[1]).sex){
        sel = []; render(); toast("Nel misto la coppia è una donna e un uomo"); return;
      }
      const pr = c.type === "misto" && P(sel[0]).sex === "M" ? [sel[1], sel[0]] : [sel[0], sel[1]];
      ev.pairs.push(pr); sel = []; save();
    }
    render(); return;
  }
  if(a === "unpair"){ ev.pairs.splice(+el.dataset.i, 1); save(); render(); return; }
  if(a === "auto"){
    autoPairs(ev, el.dataset.m); save(); render();
    const fuori = (ev.presenti||[]).length - ev.pairs.length*2;
    if(fuori > 0) toast(fuori === 1 ? "Uno resta senza coppia" : fuori + " restano senza coppia");
    return;
  }
  if(a === "board"){ buildBoard(ev); step = "tabellone"; save(); render(); return; }
  if(a === "win"){ const m = ev.matches[+el.dataset.i];
    m.winner = (m.winner === el.dataset.s) ? null : el.dataset.s; save(); render(); return; }
  if(a === "finale8"){
    if(finaleDi(c)){ toast("La finale esiste già"); return; }
    const top = classifica(c).filter(r => r.pres > 0).slice(0, 8);
    if(top.length < 8){ toast("Servono almeno 8 giocatori con presenze"); return; }
    if(!confirm("Creo la finale fra i primi 8: " + top.map(r => r.name).join(", ") + "?")) return;
    const ids = top.map(r => r.id);
    const coppie = [[ids[0], ids[7]], [ids[3], ids[4]], [ids[1], ids[6]], [ids[2], ids[5]]];
    const seeds = {}; const t = totals(null, c);
    coppie.forEach((pr,i) => seeds[i] = (t[pr[0]] ? t[pr[0]].pts : 0) + (t[pr[1]] ? t[pr[1]].pts : 0));
    const id = uid();
    c.events.push({id, created:Date.now(), name:"Finale a 8", date:oggi(), ora:"", mult:1, campi:2,
      finale:true, status:"bozza", presenti:ids, pairs:coppie, seeds,
      matches:[{pa:0, pb:1, winner:null}, {pa:2, pb:3, winner:null}],
      storico:[], ordine:null, punti:null});
    openEvent = id; step = "tabellone"; save(); render();
    toast("Finale creata: controlla le coppie"); return;
  }
  if(a === "turno"){
    ev.storico = ev.storico || [];
    ev.storico.push(ev.matches.map(m => ({pa:m.pa, pb:m.pb, winner:m.winner})));
    ev.matches = prossimoTurno(ev);
    ev.ordine = null; ev.punti = null;
    save(); render(); toast((ev.storico.length + 1) + "° turno pronto");
    return;
  }
  if(a === "indietro"){
    if(!(ev.storico || []).length) return;
    ev.matches = ev.storico.pop();
    ev.ordine = null; ev.punti = null;
    save(); render(); return;
  }
  if(a === "vaipunteggio"){ ev.ordine = ev.ordine || []; step = "punteggio"; save(); render(); return; }
  if(a === "piazza"){
    ev.ordine = ev.ordine || [];
    const pi = +el.dataset.pi; if(!ev.ordine.includes(pi)) ev.ordine.push(pi);
    save(); render(); return;
  }
  if(a === "togli"){ ev.ordine.splice(+el.dataset.k, 1); save(); render(); return; }
  if(a === "ricomincia"){ ev.ordine = []; save(); render(); return; }
  if(a === "assegna"){
    const nGioc = ev.ordine.length * 2;
    if(!confirm(`Assegno i punti di "${ev.name}" a ${nGioc} giocatori e chiudo la giornata? La classifica si aggiorna e la giornata sparisce dall'elenco.`)) return;
    const n = chiudiGiornata(ev);
    openEvent = null; tab = "giornate"; save(); render();
    toast("Classifica aggiornata per " + n + " giocatori"); return;
  }
  if(a === "annullaultima"){
    const u = c.ultima; if(!u) return;
    if(!confirm(`Tolgo dalla classifica i punti di "${u.nome}" e la riapro per correggere l'ordine?`)) return;
    const id = annullaUltima();
    if(id){ openEvent = id; step = "punteggio"; }
    save(); render(); toast("Punti tolti, giornata riaperta"); return;
  }
  if(a === "su" || a === "giu"){
    const k = +el.dataset.k, j = a === "su" ? k-1 : k+1;
    if(j < 0 || j >= ev.ordine.length) return;
    const t2 = ev.ordine[k]; ev.ordine[k] = ev.ordine[j]; ev.ordine[j] = t2;
    save(); render(); return;
  }
  if(a === "ricalcola"){
    ev.ordine = ordineDaTabellone(ev); ev.punti = null; initPunti(ev);
    save(); render(); toast("Punti ricalcolati"); return;
  }
  if(a === "close"){ ev.status = "chiuso"; save(); render(); toast("Classifica aggiornata"); return; }
  if(a === "reopen"){ ev.status = "bozza"; step = "tabellone"; save(); render(); return; }
  if(a === "correggi"){ ev.status = "bozza"; initPunti(ev); step = "punti"; save(); render(); return; }

  /* giocatori */
  if(a === "player"){ sheet = {tipo:"player", id:el.dataset.id}; render(); return; }
  if(a === "rename"){ const p = P(el.dataset.id), v = prompt("Nome", p.name);
    if(v && v.trim()){ p.name = v.trim(); save(); render(); } return; }
  if(a === "sex"){ const p = P(el.dataset.id); p.sex = p.sex === "F" ? "M" : "F"; save(); render(); return; }
  if(a === "archive"){ const p = P(el.dataset.id); p.archived = !p.archived; save(); render(); return; }
  if(a === "merge"){
    const to = document.getElementById("mergeTo").value, from = el.dataset.id;
    if(!to){ toast("Scegli prima con chi unirla"); return; }
    if(!confirm(`Unisco ${P(from).name} dentro ${P(to).name}? Punti e presenze si sommano.`)) return;
    mergePlayers(from, to); sheet = {tipo:"player", id:to}; save(); render(); toast("Schede unite"); return;
  }

  /* impostazioni */
  if(a === "cset"){
    const k = el.dataset.k;
    const lim = k === "soglia" ? [0,40] : k === "settimane" ? [6,12] : k === "base" ? [0,40] : [0,50];
    const base = k === "settimane" ? (c.settimane || 8) : k === "base" ? (c.base || 0) : c[k];
    if(k !== "settimane" && k !== "base" && c.bonusAss){ toast("Annulla prima il bonus già assegnato"); return; }
    c[k] = Math.max(lim[0], Math.min(lim[1], base + (+el.dataset.v))); save(); render(); return;
  }
  if(a === "bonusdai"){
    if(c.bonusAss){ toast("Il bonus è già stato assegnato"); return; }
    const quanti = anteprimaBonus(c);
    if(!confirm(`Assegno ${c.bonus} punti a chi ha più di ${c.soglia} presenze? Riguarda ${quanti} giocatori e si fa una volta sola.`)) return;
    assegnaBonus(c); save(); render(); toast("Bonus assegnato a " + quanti + " giocatori"); return;
  }
  if(a === "bonusvia"){
    if(!confirm("Tolgo il bonus dalla classifica? Potrai riassegnarlo con valori diversi.")) return;
    c.bonusAss = null; save(); render(); toast("Bonus annullato"); return;
  }
  if(a === "set"){ D.settings.campi = Math.max(1, Math.min(12, D.settings.campi + (+el.dataset.v))); save(); render(); return; }
  if(a === "export"){ doExport(); return; }
  if(a === "wipe"){ if(confirm("Cancello tutto da questo browser?")){
      try{ localStorage.removeItem(KEY); }catch(e){}
      D = fresh(); openEvent = null; sheet = null; save(); render(); } return; }
  if(a === "login"){ sheet = {tipo:"login"}; render(); return; }
  if(a === "logout"){ if(confirm("Esco dalla modalità gestore su questo dispositivo?")) logout(); return; }
  if(a === "sync"){ syncNow(false); return; }
  if(a === "loca"){ LOCA = []; sheet = {tipo:"locandina", id:openEvent}; render(); return; }
  if(a === "stampaclass"){ LOCA = []; sheet = {tipo:"classifica"}; render(); return; }
  if(a === "loca-png"){ locaSave("png"); return; }
  if(a === "loca-pdf"){ locaSave("pdf"); return; }
  if(a === "loca-share"){ locaShare(); return; }
  if(a === "dellogo"){ D.settings.logo = null; save(); render(); return; }
  if(a === "shareclass"){ copia(testoClassifica()); return; }

function mergePlayers(from, to){
  D.champs.forEach(ch => {
    const f = ch.carry[from];
    if(f){ const t = ch.carry[to] || {pts:0, pres:0};
      ch.carry[to] = {pts:(t.pts||0)+(f.pts||0), pres:(t.pres||0)+(f.pres||0)}; delete ch.carry[from]; }
    ch.events.forEach(ev => {
      ev.presenti = (ev.presenti||[]).map(x => x === from ? to : x).filter((x,i,arr) => arr.indexOf(x) === i);
      ev.pairs = (ev.pairs||[]).map(pr => pr.map(x => x === from ? to : x));
    });
  });
  D.players = D.players.filter(p => p.id !== from);
}

/* --- accoda le differenze; funziona anche senza rete --- */
function pushDiff(){
  if(!canWrite()) return;
  const now = snapOf(rowsOf(D));
  const prev = SNAP || {players:{}, champs:{}, events:{}, settings:{}};
  for(const t in now){
    const p = prev[t] || {};
    for(const id in now[t]) if(p[id] !== now[t][id]) QUEUE.push({op:"up", t, row:JSON.parse(now[t][id])});
    for(const id in p) if(!(id in now[t])) QUEUE.push({op:"del", t, id});
  }
  SNAP = now; compatta(); qSave(); flush();
}
function compatta(){
  const m = new Map();
  QUEUE.forEach(o => m.set(o.t + "|" + (o.op === "del" ? o.id : o.row.id), o));
  QUEUE = [...m.values()];
}
async function flush(){
  if(flushing || !canSync() || !QUEUE.length) return;
  flushing = true; compatta(); qSave();
  const rev = D.rev || 0;
  try{
    while(QUEUE.length){
      const o = QUEUE[0];
      const res = o.op === "up"
        ? await SB.from(o.t).upsert(o.row)
        : await SB.from(o.t).delete().eq("id", o.id);
      if(res.error) throw res.error;
      QUEUE.shift(); qSave();
    }
    ls(RKEY, String(rev));
    setSync("ok");
  }catch(e){
    setSync("errore", (e && e.message) || "rete non raggiungibile");
  }
  flushing = false;
  if(!openEvent && !sheet && tab === "altro") render();
}

  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#F4F4F2"); g.addColorStop(1,"#D8DAD8");
  x.fillStyle = g; x.fillRect(0,0,W,H);

  const L = 40, R = W - 40;
  if(logo){
    const s = 186, ar = logo.width / logo.height;
    const w = ar >= 1 ? s : s*ar, h = ar >= 1 ? s/ar : s;
    x.drawImage(logo, L, 34, w, h);
  }
  const left = logo ? L + 210 : L;

  x.textAlign = "right"; x.textBaseline = "alphabetic"; x.fillStyle = "#16365C";
  const titolo = (ch.name + " " + edizioneDi(ch)).trim().toUpperCase();
  fitFont(x, titolo, R - left, "800", 62, 24);
  x.fillText(titolo, R, 96);

  x.fillStyle = "#2F5F8E";
  const turno = (ev.storico || []).length + 1;
  const riga1 = ev.finale ? (turno === 1 ? "SEMIFINALI" : "FINALE")
                          : (turno === 1 ? "INGRESSO IN CAMPO" : turno + "° TURNO");
  fitFont(x, riga1, R - left, "700", 42, 20);
  x.fillText(riga1, R, 152);
  const sub = "(" + (ev.name || "").toUpperCase() + ")";
  fitFont(x, sub, R - left, "700", 42, 20);
  x.fillText(sub, R, 202);

  const dl = dataLunga(ev);
  if(dl){ x.fillStyle = "#39434A"; fitFont(x, dl, R - left, "400", 30, 16); x.fillText(dl, R, 250); }

  for(let i=0; i<n; i++){
    const m = ev.matches[i], top = HEAD + i*ROW;
    x.fillStyle = "#C7B079"; rrect(x, 130, top, 820, 40, 5); x.fill();
    x.fillStyle = "#2B2B2B"; x.textAlign = "center"; x.textBaseline = "middle";
    fitFont(x, campoLabel(ev,i).replace(/ · .*/,""), 760, "600", 31, 18);
    x.fillText(campoLabel(ev,i).replace("CAMPO","CAMPO"), 540, top+21);

    const cy1 = top + 104, cy2 = top + 160, cym = (cy1+cy2)/2;
    const A = ev.pairs[m.pa], B = (m.pb === null || m.pb === undefined) ? null : ev.pairs[m.pb];
    const won = s => m.winner === s;

    const lato = (ids, dir, win) => {
      const cxC = dir < 0 ? 58 : W - 58;
      const nx  = dir < 0 ? 104 : W - 104;
      const u1  = dir < 0 ? 98 : 640, u2 = dir < 0 ? 440 : W - 98;
      x.textAlign = dir < 0 ? "left" : "right";
      ids.forEach((id, k) => {
        const cy = k ? cy2 : cy1;
        pallina(x, cxC, cy, 28, "#A98A4F", String(t[id] ? t[id].pts : 0), "#FFFFFF", 28);
        x.fillStyle = "#15191C"; x.textBaseline = "middle";
        x.textAlign = dir < 0 ? "left" : "right";
        fitFont(x, nm(id), 334, win ? "700" : "500", 31, 17);
        x.fillText(nm(id), nx, cy);
      });
      x.strokeStyle = "#13171A"; x.lineWidth = 5; x.lineCap = "round";
      x.beginPath(); x.moveTo(u1, cym); x.lineTo(u2, cym); x.stroke();
    };

    lato(A, -1, won("a"));
    if(B) lato(B, 1, won("b"));
    else {
      x.fillStyle = "#7A8488"; x.textAlign = "right"; x.textBaseline = "middle";
      fitFont(x, "riposo", 300, "500", 31, 18);
      x.fillText("riposo", W - 104, cym);
    }

    pallina(x, 492, cym, 42, "#F6E7C6", String(ev.seeds ? ev.seeds[m.pa] : 0), "#2B2B2B", 34);
    if(B) pallina(x, 592, cym, 42, "#F7C98C", String(ev.seeds ? ev.seeds[m.pb] : 0), "#2B2B2B", 34);
  }

  if(D.settings.firma){
    x.fillStyle = "#4C5559"; x.textAlign = "center"; x.textBaseline = "middle";
    fitFont(x, D.settings.firma, W - 120, "700", 36, 18);
    x.fillText(D.settings.firma, W/2, H - 62);
  }
  return cv;
}

async function offriFile(filename, blob){
  try{
    if(typeof claude !== "undefined" && claude.use){
      const dl = await claude.use("downloads");
      if(dl){ await dl.save({filename, data:blob}); toast("Salvato"); return; }
    }
  }catch(e){ if(e && e.code === "declined") return; }
  try{
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
    toast("Scaricato");
  }catch(e){
    try{ window.open(URL.createObjectURL(blob), "_blank"); toast("Aperto in una nuova scheda"); }
    catch(e2){ toast("Download non disponibile qui"); }
  }
}
function baseNome(){
  const ev = sheet && sheet.tipo === "locandina" ? EV(sheet.id) : null;
  const t = ev ? C().name + " " + ev.name : C().name + " classifica";
  return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").toLowerCase();
}
async function pagineBlob(){
  return Promise.all(LOCA.map(cv => new Promise(r => cv.toBlob(r, "image/png"))));
}
async function locaSave(fmt){
  if(!LOCA.length || !sheet){ toast("Immagine non pronta"); return; }
  const base = baseNome();
  if(fmt === "png"){
    const blobs = await pagineBlob();
    for(let i=0; i<blobs.length; i++)
      await offriFile(base + (blobs.length > 1 ? "-" + (i+1) : "") + ".png", blobs[i]);
  } else {
    const J = window.jspdf && window.jspdf.jsPDF;
    if(!J){ toast("PDF non disponibile, scarica l'immagine"); return; }
    let doc = null;
    LOCA.forEach((cv, i) => {
      if(i === 0) doc = new J({orientation:"p", unit:"px", format:[cv.width, cv.height], compress:true});
      else doc.addPage([cv.width, cv.height], "p");
      doc.addImage(cv.toDataURL("image/png"), "PNG", 0, 0, cv.width, cv.height);
    });
    await offriFile(base + ".pdf", doc.output("blob"));
  }
}
async function locaShare(){
  if(!LOCA.length) return;
  const base = baseNome();
  const blobs = await pagineBlob();
  const files = blobs.map((b,i) => new File([b], base + (blobs.length > 1 ? "-" + (i+1) : "") + ".png", {type:"image/png"}));
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  toast("Condivisione non disponibile: scarica le immagini");
}
function setLogo(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const s = 320, ar = i.width / i.height;
      const cv = document.createElement("canvas");
      cv.width = ar >= 1 ? s : Math.round(s*ar);
      cv.height = ar >= 1 ? Math.round(s/ar) : s;
      cv.getContext("2d").drawImage(i, 0, 0, cv.width, cv.height);
      D.settings.logo = cv.toDataURL("image/png");
      save(); render(); toast("Logo caricato");
    };
    i.onerror = () => toast("Immagine non valida");
    i.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- testo e backup ---------- */
function testoClassifica(){
  const c = C(), l = classifica().filter(r => r.pres > 0);
  return [c.name, "Classifica generale", ""]
    .concat(l.map((r,i) => `${i+1}. ${r.name} — ${r.tot} pt (${r.pres} pres.)`)).join("\n");
}
function testoEvento(ev){
  const pts = eventPoints(ev);
  return [C().name, ev.name + " · " + dataIt(ev.date), ""]
    .concat(placements(ev).map((pi,k) => {
      const pr = ev.pairs[pi];
      return `${k+1}. ${nm(pr[0])} e ${nm(pr[1])} — ${pts[pr[0]]||0} pt`;
    })).join("\n");
}
function copia(txt){
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(()=>toast("Copiato")).catch(()=>fallback(txt));
  else fallback(txt);
}
function fallback(txt){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Copiato"); }catch(e){ toast("Copia non riuscita"); }
  ta.remove();
}
async function doExport(){
  const blob = new Blob([JSON.stringify(D, null, 1)], {type:"application/json"});
  await offriFile("mundialito-" + oggi() + ".json", blob);
}
function doImport(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !d.players || !d.champs) throw 0;
      if(!confirm("Sostituisco i dati di questo browser con il backup?")) return;
      D = d; D.settings = D.settings || {campi:5}; D.cur = D.cur || D.champs[0].id;
      openEvent = null; sheet = null; save(); render(); toast("Backup caricato");
    }catch(e){ toast("File non valido"); }
  };
  r.readAsText(file);
}

D = load() || fresh();
normalizzaTornei();
try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){}
render();
initSync();
